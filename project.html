<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project | Yassin</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html#home">YASSIN.<span>AI</span></a>
        <nav class="site-nav" aria-label="Primary">
          <ul class="nav-list">
            <li><a href="index.html#home">Home</a></li>
            <li><a href="index.html#projects">Projects</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#contact">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main" class="container detail-page"></main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-identity">
          <p class="footer-name">Yassin</p>
          <p class="footer-tagline">Machine Learning Engineer in Progress</p>
        </div>
        <ul class="footer-links" id="footer-socials" aria-label="Social links"></ul>
      </div>
    </footer>

    <script src="projects.js"></script>
    <script src="project-details.js"></script>
    <script>
      const id = new URLSearchParams(location.search).get("id");
      const project = PROJECTS.find((p) => p.id === id);
      const root = document.getElementById("main");
      if (project) {
        document.title = project.title + " | Yassin";
        renderProjectDetail(project, root);
      } else {
        root.innerHTML = '<a class="back-link" href="index.html#projects">&larr; Back to projects</a><h1 class="detail-title">Project not found</h1><p class="section-intro">Choose a project from the gallery.</p>';
      }
      document.getElementById("footer-socials").innerHTML = socialLinks();
    </script>
  </body>
</html>
